name: No Red Zone Scanner

on:

  schedule:
    - cron: "50 23 * * *"

  workflow_dispatch:

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python no_red_zone.py
